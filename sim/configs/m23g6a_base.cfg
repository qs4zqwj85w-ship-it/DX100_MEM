# M23-G6A — translation-first, DRAM-second: the experiment configuration.
#
# Byte-identical to configs/m23_dx16k.cfg (the published M23 DX-100
# configuration) except for four additions, none of which touches a modelled
# decision on a run that does not select the new policy:
#
#   1. g6a_pa_capacity = 65536: the physical-address buffer the G6A policy
#      provisions, one entry per line run of the window being translated. It is
#      a *declared* resource, not a loaded one: a P0 or P2 cell allocates
#      nothing and its cycle count is unchanged. A window that needs more
#      entries than this refuses the run instead of truncating silently.
#   2. bulk_org is declared (default 0) so every log echoes the policy.
#   3. bulk_max_elems = 16 M: a validation bound on the trace, raised so the
#      100-D ogbn-products trace (8.4 M accesses) is accepted.
#   4. max_cycles = 3e9: the guard has to sit well above the longest cell, or a
#      slow policy would be reported as DNF. A cell that reaches it is reported
#      as DNF and never as a result.
#
# P0, P2, ideal-translation P2 and G6A are all run on THIS file, so the only
# difference between them is `bulk_org` (and `ideal_translation` for the
# reference arm). Translation and DRAM capacities are the published ones.
#
# Run:
#   ./bin/dx100sim --config configs/m23g6a_base.cfg \
#     --set dataset=../build/wm/m23_orkut_bfs.bin \
#     --set bulk_index_base=0x80000000 --set bulk_desc_line=0x1FFFFC0 \
#     --set bulk_max_elems=2097152 --set bulk_org=6 --all

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

ideal_translation = 0

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two 16K-entry context buffers -----------------------
experiment = none
dispatch = 1
op_class = gen
dispatch_order = 0

batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 2
dedup = 1
page_order = 1

# 0 = P0, 2 = P2, 6 = M23-G6A (translation first, DRAM second)
bulk_org = 0
# the G6A physical-address buffer: 16 B per entry {physical line, cycle}
g6a_pa_capacity = 65536

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 16777216

cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 3000000000
