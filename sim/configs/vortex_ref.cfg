# Vortex reference configuration (ref/vortex @ 7300bc8, VX_config.toml defaults).
# Every value below is transcribed from that file; see m4-baseline-calibration-report.md
# for the line references. Use with --config.
#
# Topology: VX_CFG_NUM_CORES=1, NUM_WARPS=4, NUM_THREADS=4, ISSUE_WIDTH=1,
# NUM_LSU_LANES=SIMD_WIDTH=4 (VX_config.toml:5,59,60,67,72,128,129).
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4          # XLEN=32 -> 4 B per lane
R = 128                 # design residency budget (not a Vortex knob)

# Outstanding loads: VX_CFG_LSU_PENDING_SIZE = min(limit, max(8, 2*4*(4/4))) = 8
# (VX_config.toml:139).
lsu_pending = 8

# L1 dcache: 16384 B, 4 ways, latency 2 (VX_config.toml:271,272,299),
# MSHR 16..64 (VX_config.toml:290).
l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 16

# L2: 1 MiB, 8 ways, latency 4 + L2_LINK_LATENCY 0 (VX_config.toml:331,332,347,352),
# MSHR 16..256 (VX_config.toml:337).
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

# Translation: DTLB 16 x 4-way, 4 MSHRs (VX_config.toml:205,207); L2 TLB 512 x 4-way,
# 8 MSHRs, latency 4 (219-223); 2 walkers, 16-entry walk cache (224-225).
dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2         # REPLAY_DEPTH
l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4
walkers = 2
walk_cache = 16
levels = 2              # Sv32 at XLEN=32 (VX_types.toml:73-76)
walk_latency_per_level = 150

# DRAM: 2 channel banks (VX_config.toml:92), HBM2 timing "14 cycles idle open-row,
# 26 row conflict, one 64 B block per cycle", unbounded queue (VX_config.toml:96-107).
banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0              # 0 = unbounded (VX_CFG_PLATFORM_MEMORY_QUEUE_SIZE = 0)
bank_hash = true

# Workload: choose per run.
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 20000000
