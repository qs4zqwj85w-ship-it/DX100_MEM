# M23-G0 — DRAM bandwidth microbenchmark instrument configuration.
#
# This file exists ONLY for the M23-G0 DRAM bandwidth audit. It is not an
# architecture configuration: no M18–M23 cell is produced or reproduced from it,
# and no historical config is modified by it.
#
# Every DRAM field below is byte-identical to the frozen M23 baselines
# (configs/m23_m0.cfg §1): banks = 2, rows = 4096, row_bytes = 1024,
# t_hit = 14, t_miss = 26, link = 0, dram_q = 0 (unbounded), frfcfs = 1,
# bank_hash = 1, dram_map = 0 (the production address map). The DRAM model is
# therefore exactly the one every published M18–M23 number was measured on.
#
# Three fields differ from the architectural configs, and each difference is a
# property of the *measurement instrument*, not of the architecture:
#
#   l1_mshr = 256, l2_mshr = 256
#       The M23 architectures cap outstanding misses at 128/64. That cap is a
#       property of the request generator, and this experiment must be able to
#       drive the controller harder than any published architecture does, or it
#       could not tell "the DRAM system is the limit" from "the client is".
#       The bench driver additionally imposes its own window K, so the
#       effective outstanding depth is min(K, MSHRs).
#
#   ideal_translation = 1
#       M23-F1's flag (default off, proven inert when unset). Translation is not
#       under test here and must not gate request supply: with it set there is
#       no dTLB lookup, no walk and no PTE traffic, so every DRAM command in
#       these logs is demand traffic for the designed sequence. Verified per
#       cell: walks = 0, pte_fetches = 0.
#
#   dram_diag = 1
#       M11.2's diagnostic block (inert when off): per-bank reads/hits/busy,
#       row-activation counts and the queue-depth histogram.
#
# Run (driver built by build/wm/m23g0_run.sh):
#   ./bin/dx100_g0bench --config configs/m23g0_bench.cfg \
#       --pattern B --count 100000 --outstanding 128

# ---- memory system: DRAM identical to the frozen M23 baselines ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 256

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 256

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

# M23-F1 ideal translation: removes translation from the measurement
ideal_translation = 1

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1
dram_map = 0

# ---- no front-end: the bench driver is the only requester ----
experiment = none
dispatch = 0
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 50000000

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
