# M23-G5A — full-dimensional (100-D) ogbn-products gather: instrument configuration.
#
# Identical to configs/m23_dx16k.cfg (the published M23 DX-100 configuration)
# with four changes, none of which touches a modelled decision except the
# workload's declared element count:
#
#   1. bulk_max_elems raised to 16 M. It is a *validation bound* on the trace
#      ("count exceeds bulk_max_elems" refuses the run), not a resource: the
#      100-D traces carry 8.4 M element accesses against the 16-D trace's 1.2 M.
#   2. bulk_org declared so every log echoes the policy (0 = P0, 2 = P2, 3 = P3).
#   3. dram_diag = 1: read-only scheduler diagnostics.
#   4. max_cycles = 3e9. The 16-D published cell needed 144 M cycles; the 100-D
#      workload issues 7x the accesses, so the guard has to move with it or every
#      cell would be guard-limited rather than measured. A cell that hits it is
#      reported as DNF, never as a result.
#
# Everything else is byte-identical to M23-DX / M23-G3: R = 128, L1/L2 geometry,
# l2_mshr, 2 banks x 4096 rows, t_hit 14 / t_miss 26, dTLB 16 x 4-way with
# 4 MSHRs and 2 walkers, page_dir, compiler-directed dispatch.
#
# Sweeps (command line): batch_window 8192|16384|32768, bulk_org 0|2|3,
# dispatch 1 (Bulk) or 0 (SIMT), ideal_translation 1 for the reference arm only.

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

ideal_translation = 0

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two context buffers --------------------------------
experiment = none
dispatch = 1
op_class = gen
dispatch_order = 0

batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 2
dedup = 1
page_order = 1

bulk_org = 0

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 16777216

cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 3000000000
