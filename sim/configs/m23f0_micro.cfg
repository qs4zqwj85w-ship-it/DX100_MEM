# M23-F0 — isolated page-walker micro-test configuration.
#
# This file exists ONLY for the M23-F0 translation audit. It is not an
# architecture configuration and is not used by any M23-A..E cell: no
# historical result is produced or reproduced from it.
#
# Purpose: 1000 independent line requests, each to a DISTINCT 4 KiB virtual
# page and each in its own instruction, so the access stream offers 1000
# compulsory translation misses and no page or line reuse:
#
#   P      = 1000 pages
#   Lambda = 1000 lines total, 1 line per page (lam = Lambda/P = 1)
#   N      = 1000 accesses
#   lanes  = 1   -> one line per instruction, 1000 instructions
#   kappa  = 0   -> every instruction is an irregular (permuted) draw
#   rho_dup= 0   -> the generator draws a permutation, so each of the 1000
#                   lines (hence pages) is touched exactly once
#
# Everything below the workload is byte-identical to the shared section of
# configs/m23_m0.cfg: same caches, same two-level Sv32 walk of 150 cycles per
# level, same DRAM. Only `walkers` is swept, and only through --set.
#
# Run (one cell per walker count, each into the separate M23-F0 directory):
#   ./bin/dx100sim --config configs/m23f0_micro.cfg --set walkers=2 --all

# ---- memory system: identical to the M23 baseline ----
cores = 1
warps_per_core = 1
lanes = 1
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

# swept by the runner: 1, 2, 4, 8
walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- no DX-100 engine: the SIMT front-end alone issues the 1000 requests ----
experiment = none
dispatch = 0
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

# ---- the micro workload ----
wl = W1
N = 1000
Lambda = 1000
P = 1000
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 5000000

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
