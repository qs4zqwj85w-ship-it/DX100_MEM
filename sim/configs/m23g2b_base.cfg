# M23-G2B — SIMT instruction-issue sensitivity instrument configuration.
#
# This file exists ONLY for the M23-G2B issue-rate measurement. Its field set is
# byte-identical to configs/m23g2a_base.cfg, which is itself configs/m23_m0.cfg
# plus `ideal_translation = 1` and `dram_diag = 1`: same core, warps, lanes, R,
# L1/L2 geometry, translation state, DRAM model and issue path. Nothing in the
# simulator is changed for M23-G2B — the front-end, the memory system and the
# binary are the ones M23-G2A ran (hashes in build/wm/m23g2b/hashes.txt).
#
# Why a separate file at all: M23-G2A's config is hash-recorded as that
# milestone's artifact and is not edited after the fact. Re-declaring it here
# keeps both provenance chains intact; `diff` between the two files is
# comments only.
#
# The one swept field is l2_mshr, on the command line:
#
#   ./bin/dx100sim --config configs/m23g2b_base.cfg \
#       --set dataset=../build/wm/m23_ogbn.bin --set l2_mshr=64 --all
#
# 64 is the frozen baseline; 128 is run as a contrast because M23-G2A showed
# that 64 spends 60-976 M cycles refusing L2 MSHR allocations. If the issue
# rate is unchanged between those two, the front-end's supply of requests does
# not depend on the L2 MSHR retry storm either.
#
# `warps_per_core` is NOT touched: the instruction-admission rule is the single
# coalescer at system.cpp:185, not the warp count.

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
# M0 lane width; the DX-100 configurations inherit it
lanes = 4
elem_bytes = 4

# shared global outstanding-request budget
R = 128
# the SIMT arm is bounded by R alone (m5.1 §3)
lsu_pending = 0
# both front-ends take the same cache path
mem_path = l1

# 16 KiB
l1_lines = 256
l1_ways = 4
l1_latency = 2
# M16 strengthening: 128, not 16
l1_mshr = 128

# 1 MiB
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
# Sv32, 4 KiB pages
levels = 2
walk_latency_per_level = 150

# M23-F1 ideal translation: the L2 MSHR pool is the only outstanding limit
ideal_translation = 1

banks = 2
rows = 4096
# address map spans 2 x 4096 x 1024 B = 8 MiB
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
# unbounded queue (VX_CFG_PLATFORM_MEMORY_QUEUE_SIZE = 0)
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: absent in M0 ----------------------------------------------
# a plain run, not a paired A/B driver
experiment = none
# no compiler-directed selection: there is no Bulk client
dispatch = 0
# no context buffer
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

# ---- 3. workload (shared by all four; identical trace, identical address map)
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000

# Accelerator geometry is inert in M0 (no engine is constructed) but is stated
# so the four files differ only where the architecture differs.
ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

# identical instrumentation in all four
cache_diag = 1
dram_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
