# M24-C / M0-RM — resource-matched conventional SIMT.
#
# This file is configs/m23_m0.cfg with EXACTLY TWO fields changed, both pure
# hardware capacities, both taken from the strongest Bulk configuration
# (M23-G6D S1, which sets them on the command line over configs/m23g6b_base.cfg):
#
#     walkers     2 -> 8     page walkers
#     dtlb_mshr   4 -> 8     dTLB miss-status-holding registers
#
# Every other SIMT resource in m23_m0.cfg already matched G6D S1 (see the audit
# in docs/m24-c-resource-matched-simt-baseline.md §2): R = 128, l1_mshr = 128,
# l2_mshr = 64, l2tlb_mshr = 8, dtlb 16x4, l2tlb 512x4, walk_cache = 16,
# levels = 2, walk_latency_per_level = 150, DRAM 2x4096 banks at 1024 B rows,
# t_hit = 14, t_miss = 26, dram_q = 0, FR-FCFS, bank_hash = 1.
#
# Nothing Bulk-specific is added: dispatch = 0, batch_window = 0, page_cohorts = 0,
# dedup = 0, page_order = 0, win_fused = 0. The request path is the unmodified
# SIMT path of m23_m0.cfg.
#
# Run:  ./bin/dx100sim --config configs/m24c_m0_rm.cfg \
#         --set dataset=../build/wm/m23_orkut_bfs.bin \
#         --set bulk_index_base=0x80000000 --set bulk_desc_line=0x1FFFFC0 \
#         --set bulk_max_elems=2097152 --all
# M23-A / M0 — strengthened conventional SIMT (no DX-100 Bulk engine).
#
# M23-A fixes four architecture configurations that differ ONLY in the DX-100
# block (section 2 below). Everything in section 1 is byte-identical across
# M0, 2x8K, 2x16K and 2x32K: caches, associativity, translation, page size,
# walkers, DRAM, address mapping, residency budget and lane width.
#
# M0 = the Vortex SIMT path with the strengthened L1 MSHR capacity (128, per
# M16: 128 L1 MSHRs saturate the shared 128-entry global request budget).
# There is no context buffer, no Bulk address generation, no Bulk scheduling
# and no Bulk request organisation. `dispatch = 0` and `batch_window = 0`
# select the legacy path exactly as every published SIMT number did, and the
# only change from the historical baseline is `l1_mshr = 16 -> 128`.
#
# Run:  ./bin/dx100sim --config configs/m23_m0.cfg
#       ./bin/dx100sim --config configs/m23_m0.cfg --all

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
# M0 lane width; the DX-100 configurations inherit it
lanes = 4
elem_bytes = 4

# shared global outstanding-request budget
R = 128
# the SIMT arm is bounded by R alone (m5.1 §3)
lsu_pending = 0
# both front-ends take the same cache path
mem_path = l1

# 16 KiB
l1_lines = 256
l1_ways = 4
l1_latency = 2
# M16 strengthening: 128, not 16
l1_mshr = 128

# 1 MiB
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 8
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 8
walk_cache = 16
# Sv32, 4 KiB pages
levels = 2
walk_latency_per_level = 150

banks = 2
rows = 4096
# address map spans 2 x 4096 x 1024 B = 8 MiB
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
# unbounded queue (VX_CFG_PLATFORM_MEMORY_QUEUE_SIZE = 0)
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: absent in M0 ----------------------------------------------
# a plain run, not a paired A/B driver
experiment = none
# no compiler-directed selection: there is no Bulk client
dispatch = 0
# no context buffer
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

# ---- 3. workload (shared by all four; identical trace, identical address map)
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000

# Accelerator geometry is inert in M0 (no engine is constructed) but is stated
# so the four files differ only where the architecture differs.
ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

# identical instrumentation in all four
cache_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
