# M23-G4C — DRAM address-mapping sensitivity: instrument configuration.
#
# Identical to configs/m23_dx16k.cfg (the published M23 DX-100 configuration)
# with three additions, none of which changes a decision:
#
#   1. bulk_org declared here so every log echoes the policy it ran
#      (0 = P0, 2 = P2). The runner overrides it on the command line.
#   2. dram_diag = 1: read-only DRAM scheduler diagnostics. Nothing written
#      under this flag is read by an arbitration, a probe or a cycle decision.
#   3. The DRAM geometry block is made explicit and is the *only* thing the
#      mapping sweep moves:
#
#        M0 production    row_bytes=1024 rows=4096 dram_il_lines=1   16 lines/row
#        M1 fine rows     row_bytes= 512 rows=8192 dram_il_lines=1    8 lines/row
#        M2 coarse rows   row_bytes=2048 rows=2048 dram_il_lines=1   32 lines/row
#        M3 4-line interleave  row_bytes=1024 rows=4096 dram_il_lines=4
#
#      All four are 2 banks x 8 MiB (banks x rows x row_bytes = 8 MiB), with the
#      same t_hit / t_miss / link / frfcfs / dram_q, the same R, L1/L2, dTLB,
#      walkers and window. `dram_il_lines = 1` reproduces the pre-M23-G4C map
#      arithmetic exactly, which is why M0 must reproduce M23-G3 cell for cell.
#
# The period at which the row index wraps is banks x rows x row_bytes, i.e. the
# capacity. Holding capacity fixed therefore holds the 8 MiB period fixed by
# construction; what the sweep varies is the structure *inside* a period.

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

ideal_translation = 0

# ---- DRAM geometry: the mapping sweep moves only this block ----------------
banks = 2
rows = 4096
row_bytes = 1024
dram_il_lines = 1

t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two context buffers --------------------------------
experiment = none
dispatch = 1
op_class = gen
dispatch_order = 0

batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 2
dedup = 1
page_order = 1

# 0 = P0 published order, 2 = P2 DRAM (row, bank) first
bulk_org = 0

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000
