# M23-G1 — request-generation instrument configuration (SIMT front-end).
#
# This file exists ONLY for the M23-G1 request-generation audit. It is not an
# architecture configuration: no M18–M23 cell is produced or reproduced from it,
# and no historical config is modified.
#
# Every section 1 field is byte-identical to the frozen M23 baseline
# (configs/m23_m0.cfg §1): one core, 4 warps, 4 lanes, R = 128, the same caches,
# the same two-level Sv32 translation, the same two-bank DRAM (banks = 2,
# rows = 4096, row_bytes = 1024, t_hit = 14, t_miss = 26, link = 0, dram_q = 0,
# frfcfs = 1, bank_hash = 1, dram_map = 0). The DRAM model is therefore exactly
# the one M23-G0 characterized and the one every published number used.
#
# Two fields differ, and both are properties of the measurement instrument:
#
#   ideal_translation = 1
#       M23-F1's flag (default off, proven inert when unset). The brief asks for
#       the data-side request generator to be isolated first, so translation is
#       removed from the primary experiment: no dTLB lookup, no translation
#       MSHR, no walker, no PTE traffic, and no translation admission limit.
#       The two `xlate=0` cells re-enable the real path as a contrast.
#
#   dram_diag = 1
#       M11.2's diagnostic block (inert when off).
#
# The workload is a file trace (Config::dataset, M18TRC1 format), so the synthetic
# W0/W1 generator fields below are inert; they are set to their defaults only so
# the file is self-describing.
#
# Run (see build/wm/m23g1_run.sh):
#   ./bin/dx100sim --config configs/m23g1_base.cfg \
#       --set dataset=../build/wm/m23g1/traces/g1_E_l4.trc --all

# ---- 1. shared memory system (identical to configs/m23_m0.cfg) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

# M23-F1 ideal translation: isolates data-side request generation
ideal_translation = 1

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1
dram_map = 0

# ---- 2. no DX-100 engine: the SIMT front-end is the only generator ----
experiment = none
dispatch = 0
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

# ---- 3. workload: supplied per cell with --set dataset=... ----
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
