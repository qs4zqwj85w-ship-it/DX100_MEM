# M23-G3 — Bulk locality-aware request organization: instrument configuration.
#
# Identical to configs/m23_dx16k.cfg (the published M23 DX-100 configuration:
# fused context buffers, two buffers, page-aware organization and scheduling,
# compiler-directed SIMT/Bulk dispatch) with exactly two differences:
#
#   1. ideal_translation = 1 — M23-F1's flag. M23-G2D measured the SIMT baseline
#      and the offline whole-stream ordering bound under this flag, and the brief
#      requires the reference points to share the translation configuration. It
#      removes dTLB/walk admission from the comparison, so what is left for the
#      organization policies to move is the DRAM (G2D: 99 % of cycles).
#   2. bulk_org is declared here so a log always prints it.
#
# Everything the comparison must hold fixed is fixed: 4 lanes, R = 128, L1/L2
# geometry, 2 banks x 4096 rows, t_hit 14 / t_miss 26, FR-FCFS, dram_q unbounded,
# batch_window (swept on the command line), ag_lanes, eng_issue, org_lanes,
# fanout_lanes, page_cohorts, page_dir, batch_deadline, idx_* .
#
# Sweeps, on the command line:
#   --set batch_window=8192|16384|32768
#   --set bulk_org=0|1|2|3        (P0..P3;  4 = diagnostic "no grouping")
#
# Run:
#   ./bin/dx100sim --config configs/m23g3_base.cfg \
#     --set dataset=../build/wm/m23_orkut_bfs.bin \
#     --set bulk_index_base=0x80000000 --set bulk_desc_line=0x1FFFFC0 \
#     --set bulk_max_elems=2097152 --set batch_window=16384 --set bulk_org=2 --all

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

# M23-F1: no dTLB, no walk, no PTE traffic (shared with the M23-G2D references)
ideal_translation = 1

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two context buffers --------------------------------
experiment = none
dispatch = 1
op_class = gen
dispatch_order = 0

# entries per context buffer; two buffers (swept: 8192 / 16384 / 32768)
batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 2
dedup = 1
page_order = 1

# M23-G3: request organization inside the fused window.
#   0 = P0 published order (ascending VA line)
#   1 = P1 cache-line reuse first
#   2 = P2 DRAM (row, bank) first
#   3 = P3 combined
#   4 = diagnostic only: no grouping (the counterfactual for P1)
bulk_org = 0

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000
