# M23-A / DX-100 2x8K — fused context buffers, compiler-directed selection.
#
# Section 1 is identical to configs/m23_m0.cfg, byte for byte. Section 2 is the
# DX-100 block: fused storage (`win_fused = 1`), two physical context buffers,
# page-aware organisation and scheduling, deduplication retained (the fused
# layout requires it: a line is a run), and compiler-directed SIMT/Bulk
# selection evaluated once, before execution, from the trace's class metadata.
#
# Run:  ./bin/dx100sim --config configs/m23_dx8k.cfg
#       ./bin/dx100sim --config configs/m23_dx8k.cfg --set m23_select=build/wm/m23_sel_8k.tsv
#
# FUSED IS THE DEFAULT FOR EVERY M23 EXPERIMENT. The unfused representation is
# historical: every M18-M21 number was measured with it and is NOT relabelled.

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two 8K-entry context buffers -----------------------
experiment = none
# compiler-directed selection, always on in M23
dispatch = 1
# the annotation is the compiler's, not a runtime probe
op_class = gen
dispatch_order = 0

# entries per context buffer; two buffers
batch_window = 8192
# fused storage is the M23 default
win_fused = 1
page_sched = 1
page_cohorts = 2
# required by the fused layout
dedup = 1
# required by the fused layout
page_order = 1

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
# dedup is the secondary optimisation; reuse stays off
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000
