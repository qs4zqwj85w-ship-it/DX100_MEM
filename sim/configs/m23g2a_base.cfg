# M23-G2A — SIMT L2 MSHR sensitivity instrument configuration.
#
# This file exists ONLY for the M23-G2A L2 MSHR sensitivity experiment. It is
# not an architecture configuration: no M18-M23 cell is produced or reproduced
# from it, and no historical config is modified.
#
# Every field is identical to the frozen M23 SIMT baseline (configs/m23_m0.cfg)
# except two instrument properties, both inert unless set, neither of which
# touches execution or the memory system:
#
#   ideal_translation = 1
#       M23-F1's flag. Removes the dTLB lookup, the translation MSHR, the
#       walkers and all PTE traffic, so data-side outstanding demand is limited
#       by the cache MSHRs alone. This is the regime M23-G2A is asked to
#       measure: under real translation the M0 cells of M23-B/C/D park at
#       12-13 outstanding on dTLB MSHRs and PTE arrival, which hides the L2
#       MSHR limit entirely (see M23-F1 sec. 6).
#
#   dram_diag = 1
#       M11.2's read-only scheduler diagnostic (per-cycle queue occupancy,
#       row-hit candidates). Every counter it writes is accumulated after the
#       cycle's arbitration decision; it is never read by a decision.
#
# The one swept field is l2_mshr, set per cell on the command line:
#
#   ./bin/dx100sim --config configs/m23g2a_base.cfg \
#       --set dataset=../build/wm/m23_ogbn.bin --set l2_mshr=64 --all
#
# l1_mshr (128), R (128), the DRAM model and the issue path are untouched, so
# the only thing that varies across the nine cells is the number of L2 MSHRs.

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
# M0 lane width; the DX-100 configurations inherit it
lanes = 4
elem_bytes = 4

# shared global outstanding-request budget
R = 128
# the SIMT arm is bounded by R alone (m5.1 §3)
lsu_pending = 0
# both front-ends take the same cache path
mem_path = l1

# 16 KiB
l1_lines = 256
l1_ways = 4
l1_latency = 2
# M16 strengthening: 128, not 16
l1_mshr = 128

# 1 MiB
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
# Sv32, 4 KiB pages
levels = 2
walk_latency_per_level = 150

# M23-F1 ideal translation: the L2 MSHR pool is the only outstanding limit
ideal_translation = 1

banks = 2
rows = 4096
# address map spans 2 x 4096 x 1024 B = 8 MiB
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
# unbounded queue (VX_CFG_PLATFORM_MEMORY_QUEUE_SIZE = 0)
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: absent in M0 ----------------------------------------------
# a plain run, not a paired A/B driver
experiment = none
# no compiler-directed selection: there is no Bulk client
dispatch = 0
# no context buffer
batch_window = 0
win_fused = 0
page_sched = 0
page_cohorts = 0
dedup = 0
page_order = 0

# ---- 3. workload (shared by all four; identical trace, identical address map)
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000

# Accelerator geometry is inert in M0 (no engine is constructed) but is stated
# so the four files differ only where the architecture differs.
ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0
bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

# identical instrumentation in all four
cache_diag = 1
dram_diag = 1
op_class = gen
dispatch_order = 0
pool_slots = 0
ab_charge_latch = 0
m23_select =
