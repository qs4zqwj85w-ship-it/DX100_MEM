# M5.1 — THE controlled A/B environment.
#
# One file, one Config object, both arms. Every value below is transcribed from
# configs/vortex_ref.cfg (which is itself transcribed from VX_config.toml @
# 7300bc8 — see m4-baseline-calibration-report.md §2 for the line references).
# The only additions are the four settings a controlled comparison needs:
#
#   mem_path = l1    both front-ends take the same cache path (m5.1 §4)
#   lsu_pending = 0  the SIMT arm is bounded by R alone, not by Vortex's
#                    8-deep outstanding-load pool (m5.1 §3)
#   eng_issue = 4    = warps_per_core, so both front-ends form at most four
#                    line requests per cycle (m5.1 §2, "issue width")
#   bulk_data_base = 0
#                    the engine's target addresses are the trace's own
#                    addresses: identical VA layout, page set and address map
#
# Run:  ./bin/dx100sim --config configs/ab_controlled.cfg --set experiment=ab
#       ./bin/dx100sim --config configs/ab_controlled.cfg --set experiment=ab_sweep
#       ./bin/dx100sim --config configs/ab_controlled.cfg --set experiment=m6 \
#           --set batch_window=8192
#       ./bin/dx100sim --config configs/ab_controlled.cfg --set experiment=m6_sweep

# ---- topology -------------------------------------------------------------
# VX_CFG_NUM_CORES=1, NUM_WARPS=4, NUM_THREADS=4, ISSUE_WIDTH=1,
# NUM_LSU_LANES=SIMD_WIDTH=4 (VX_config.toml:5,59,60,67,72,128,129)
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4          # XLEN=32 -> 4 B per lane

# ---- residency budget (shared by both arms) -------------------------------
# R = L2_MSHR x banks = 64 x 2 = 128 (v3 §2.3 / design C22). ONE budget for the
# whole memory system: the engine holds slots in it, the SIMT front-end holds
# slots in it.
R = 128
lsu_pending = 0         # 0 = no per-core cap beyond R

# ---- memory access path (identical for both arms) -------------------------
mem_path = l1

# ---- caches ---------------------------------------------------------------
# L1 dcache 16 KiB, 4-way, 2 cycles, 16 MSHRs (VX_config.toml:271,272,299,290)
l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 16

# L2 1 MiB, 8-way, 4 cycles, 64 MSHRs (VX_config.toml:331,332,347,337)
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

# ---- translation ----------------------------------------------------------
# DTLB 16 x 4-way with 4 MSHRs (VX_config.toml:205,207)
dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2         # REPLAY_DEPTH
# L2 TLB 512 x 4-way, 8 MSHRs, 8 requesters, 4 cycles (VX_config.toml:219-223)
l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4
# 2 walkers, 16-entry walk cache, Sv32 2 levels (VX_config.toml:224,225;
# VX_types.toml:73-76)
walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

# ---- DRAM -----------------------------------------------------------------
# 2 channel banks, HBM2 14/26 cycles, 64 B/cycle, unbounded queue
# (VX_config.toml:92,96-107)
banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- workload (materialized once, then given to both arms) ----------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 20000000

# ---- accelerator parameters ----------------------------------------------
ag_lanes = 8            # design §3.2 (addresses per cycle)
eng_issue = 4           # = warps_per_core: same request formation rate
idx_window = 0          # 0 = the R budget bounds the index stream too
desc_fetch = 1          # the descriptor is read from memory (design §4.4)

# bulk gather derived from the same trace: index[i] = trace_addr[i] / elem_bytes
# and data_base = 0, so B's target addresses are exactly A's trace addresses.
bulk_wl = E0
bulk_index_base = 0x00800000    # 8 MiB, clear of the 1 MiB data footprint
bulk_data_base = 0
bulk_desc_line = 98304          # 6 MiB, between data and index array
bulk_max_elems = 65536

# ---- M6: bulk visibility window (m6-architecture-investigation.md) ---------
# batch_window = W: elements a window may hold. 0 keeps the M5 FIFO generator
# byte for byte, which is the default so the published M5.1 numbers (A=270753,
# B=278034, B requests=17409) reproduce exactly.
# W, R and page_dir are three INDEPENDENT budgets: W bounds pending elements,
# R bounds outstanding line requests, page_dir bounds pages resident in a window.
# Sweep: --set experiment=m6_sweep  (W = 128..16384 x {dedup, page_order})
batch_window = 0
page_dir = 512          # distinct pages a window may hold (W1's page set)
org_lanes = 4           # organizer: entries visited per cycle
fanout_lanes = 4        # elements reconstructed per cycle from one fill
batch_deadline = 4096   # seal a partial window after this many cycles
org_overlap = 1         # fill the next window while the current one issues
dedup = 1               # fold elements sharing a line onto one request
page_order = 1          # issue pages ascending, lines ascending within a page

# M5.1 §8.1: charge the SIMT coalescer latch (<= lanes) against A's slot pool so
# peak outstanding is R in both arms. 0 preserves the published M5.1 config.
ab_charge_latch = 0

# ---- M13: bounded cross-window reuse buffer (OFF — not an official default) ----
# A set-associative store of COMPLETED 64 B target lines, keyed on the VA line the
# window already groups on. Sealing a window looks every distinct line up once; a
# hit retires that window's elements from retained bytes, so no request is formed
# and no residency slot is taken. A line still outstanding can instead be merged
# into the existing request (one request serves both windows).
#
# Every key below defaults to the values shown, and `reuse_dir = 0` means the
# mechanism is absent: M10's official configuration is two 8K windows and nothing
# else, and the M12 2x16K / 2x32K references are unaffected. M13 is an
# investigation, not a new baseline (docs/m13-cross-window-reuse-report.md §10).
#
#   reuse_dir    = 1        enable the buffer            (default 0 = OFF)
#   reuse_sets   = 256      sets; entries = sets x ways  (default 256)
#   reuse_ways   = 4        ways per set, LRU inside    (default 4)
#   reuse_hash   = 1        mixing hash for the set index, as the DRAM bank index
#                           is hashed: `line % sets` aliases strided footprints
#   reuse_merge  = 1        also merge into requests still outstanding
#   reuse_charge = 1        charge one organizer visit per lookup/insertion
#   m13_dump     = <path>   diagnostic: append one record per sealed window
#                           (its distinct target lines) to <path>; empty = off
#
# Example (2 x 8K windows + a 16 384-entry buffer, W1 at N = 65 536):
#   --set reuse_dir=1 --set reuse_sets=4096 --set reuse_ways=4
# reuse_dir = 0
# reuse_sets = 256
# reuse_ways = 4
# reuse_hash = 1
# reuse_merge = 1
# reuse_charge = 1

experiment = ab
