# M23-G4A — Translation-resource sensitivity of row-aware Bulk.
#
# Identical to configs/m23_dx16k.cfg (the published M23 DX-100 configuration)
# with three additions, none of which changes a decision:
#
#   1. bulk_org = 0 declared here, so every log echoes the policy it ran.
#      The matrix overrides it to 0 (P0) or 2 (P2) on the command line.
#   2. dram_diag = 1: read-only DRAM scheduler diagnostics. Nothing written
#      under this flag is read by an arbitration, a probe or a cycle decision
#      (see memory.cpp), so it cannot move a result.
#   3. The translation sweep is declared below as a comment: dtlb_mshr and
#      walkers are the ONLY parameters the matrix moves. Everything else —
#      R, L1/L2 geometry, l2_mshr, banks/rows/timings, batch_window,
#      ag_lanes, org_lanes, fanout_lanes, page_dir, batch_deadline, the
#      compiler-directed dispatch — is byte-identical to M23-G3's published
#      cells, which is what makes the delta against those cells meaningful.
#
# Translation sweep (command line):
#   --set dtlb_mshr=4 --set walkers=2    baseline (= published DX-100)
#   --set dtlb_mshr=8 --set walkers=2
#   --set dtlb_mshr=4 --set walkers=4
#   --set dtlb_mshr=8 --set walkers=4
#   --set ideal_translation=1            reference only, not deployable
#
# Run:
#   ./bin/dx100sim --config configs/m23g4a_base.cfg \
#     --set dataset=../build/wm/m23_orkut_bfs.bin \
#     --set bulk_index_base=0x80000000 --set bulk_desc_line=0x1FFFFC0 \
#     --set bulk_max_elems=2097152 --set batch_window=16384 --set bulk_org=2 --all

# ---- 1. shared memory system (identical in all four M23 configurations) ----
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4

R = 128
lsu_pending = 0
mem_path = l1

l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128

l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 4
dtlb_parked = 2

l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4

walkers = 2
walk_cache = 16
levels = 2
walk_latency_per_level = 150

# M23-G4A reference setting only; the matrix sets it on the command line.
ideal_translation = 0

banks = 2
rows = 4096
row_bytes = 1024
t_hit = 14
t_miss = 26
link = 0
dram_q = 0
frfcfs = 1
bank_hash = 1

# ---- 2. DX-100: fused, two context buffers --------------------------------
experiment = none
dispatch = 1
op_class = gen
dispatch_order = 0

batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 2
dedup = 1
page_order = 1

# M23-G4A compares exactly two policies:
#   0 = P0 published order (ascending VA line)
#   2 = P2 DRAM (row, bank) first
bulk_org = 0

ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
reuse_dir = 0

bulk_wl = E0
bulk_index_base = 0x00800000
bulk_data_base = 0
bulk_desc_line = 98304
bulk_max_elems = 65536

cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 3. workload (shared by all four) --------------------------------------
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
max_cycles = 200000000
