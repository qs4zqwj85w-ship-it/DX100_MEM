# M27 production Bulk configuration - the unambiguous default from M27 on.
#
# This file is build/wm/m24d/m24d_bulk.cfg (the pinned M24-D representative,
# preserved unchanged as a historical artifact) with exactly one semantic
# difference: the engine performs page organization only.
#
#   m24_dram_org = 0   the sealed (ascending-line) order is the release order:
#                      no physical row/bank sort of the release stream and no
#                      consultation of the DRAM controller's bank/row state.
#
# Everything else is identical: same caches, same L1 path (mem_path = l1), same
# TLB, walkers, MSHRs, residency budget R, DRAM controller, FR-FCFS policy and
# timing constants. The Bulk feature set is the dispatch path (dispatch), the
# window organiser (batch_window, win_fused), the page-cohort scheduler
# (page_sched, page_cohorts), intra-line dedup (dedup) and the sealed page order
# (page_order).
#
# The historical physical-order organiser remains available for comparison by
# setting m24_dram_org = 1 (see build/wm/m24d/m24d_bulk.cfg); it is never on by
# default and no M24/M25 result was re-run or relabelled to produce this file.
#
# Run:  ./bin/dx100sim --config ../configs/m27_bulk.cfg \
#         --set dataset=../build/wm/m23_orkut_bfs.bin --all

# ---- 1. topology and execution --------------------------------------------
cores = 1
warps_per_core = 4
lanes = 4
elem_bytes = 4
# global outstanding-request budget, shared by every requester
R = 128
# 0 = unlimited: R alone bounds residency (VX_CFG_LSU_PENDING_SIZE = 0)
lsu_pending = 0
mem_path = l1
core_map = round_robin

# ---- 2. caches -------------------------------------------------------------
# 16 KiB, 4-way
l1_lines = 256
l1_ways = 4
l1_latency = 2
l1_mshr = 128
# 1 MiB, 8-way
l2_lines = 16384
l2_ways = 8
l2_latency = 4
l2_mshr = 64

# ---- 3. translation --------------------------------------------------------
dtlb_entries = 16
dtlb_ways = 4
dtlb_mshr = 8
dtlb_parked = 2
l2tlb_entries = 512
l2tlb_ways = 4
l2tlb_mshr = 8
l2tlb_latency = 4
walkers = 8
walk_cache = 16
# Sv32, two levels, 150 cycles per level
levels = 2
walk_latency_per_level = 150
ideal_translation = 0

# ---- 4. DDR model ----------------------------------------------------------
banks = 2
rows = 4096
row_bytes = 1024
dram_il_lines = 1
t_hit = 14
t_miss = 26
link = 0
# unbounded queue, FR-FCFS, XOR bank hash
dram_q = 0
frfcfs = 1
bank_hash = 1
# production address map only
dram_map = 0

# ---- 5. page size and memory hierarchy selection ---------------------------
# 4 KiB pages; the M24-B HBM hierarchy is not instantiated (dram_kind = ddr),
# and neither file sets an hbm_* field, so both take the same defaults.
page_bytes = 4096
dram_kind = ddr

# ---- 6. physical-mapping experiments (M24-A) -------------------------------
# M0 historical map, seed 1, physical-order release organization for the engine
m24_map = 0
m24_perm_seed = 1
m24_dram_org = 0

# ---- 7. ARCHITECTURE: the only eight lines that differ from m24d_simt.cfg --
dispatch = 1
batch_window = 16384
win_fused = 1
page_sched = 1
page_cohorts = 8
dedup = 1
page_order = 1
bulk_org = 8
# ---- end ARCHITECTURE -----------------------------------------------------

# ---- 8. DX-100 geometry (inert while dispatch = 0) ------------------------
experiment = none
op_class = gen
dispatch_order = 0
ag_lanes = 8
eng_issue = 4
idx_window = 0
desc_fetch = 1
idx_oracle = 0
idx_mode = 2
idx_buf_lines = 64
idx_mshr = 64
idx_reserve = 8
page_dir = 512
org_lanes = 4
fanout_lanes = 4
batch_deadline = 4096
org_overlap = 1
park_retry = 1
bulk_stream = 0
# 255 = unset: the effective policy follows dispatch (E0 for SIMT, E3 for Bulk)
win_policy = 255
win_abs_cap = 4
g6a_pa_capacity = 65536
g6b_pa_capacity = 4096
sched_vis = 0
sched_group = 0
g6i_diag = 0

# ---- 9. instrumentation ---------------------------------------------------
# identical in both arms: diagnostics only, no decision reads them
cache_diag = 1
dram_diag = 1
pool_slots = 0
ab_charge_latch = 0
m23_select =

# ---- 10. workload ---------------------------------------------------------
# overridden per cell by --set dataset=..., identically in both arms
wl = W1
N = 16384
Lambda = 16384
P = 512
kappa = 0
rho_dup = 0
seed = 1
bulk_wl = E0
# inert for SIMT; pinned to the value every published trace cell used, so the
# two arms cannot differ in index-array placement
bulk_index_base = 0x80000000
bulk_data_base = 0
bulk_desc_line = 0x1FFFFC0
bulk_max_elems = 16777216

# ---- 11. guard -----------------------------------------------------------
# one value for both arms. The slowest cell that completes is 176 184 939; the
# guard is set to 500 000 000 so that a cell which fails to terminate is
# distinguishable from a slow one (one Bulk mapping cell does: see
# build/wm/m24d/extract.txt section 11).
max_cycles = 500000000
skip_b = 0
